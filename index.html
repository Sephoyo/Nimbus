<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="src/style.css" rel="stylesheet">
  <title>Nimbus</title>
</head>

<body class="min-h-screen bg-linear-to-b from-purple-950 to-slate-950 bg-no-repeat">
  <div id="navbar" class="flex bg-slate-950 justify-between items-center p-5">
    <p class="font-bold font-weight: 700 text-purple-500">
      Nimbus
    </p>
    <button class="rounded-sm bg-purple-600 p-3 text-white">Se connecter</button>
  </div>
  <div id="text" class="flex flex-col justify-center items-center p-4">
    <div class="text-white font-bold text-4xl text-center p-4">Toutes vos séries,<br> sans coupure publicitaire.</div>
    <div class="text-white text-center pb-4">Un seul abonnement, un accès illimité. Regardez où vous voulez, quand vous
      voulez,<br> résiliable à tout moment</div>
    <div>
      <input class="rounded-sm text-white border border-gray-600 p-1 bg-gray-900" type="text"
        placeholder="Adresse e-mail">
      <button class="text-white">Commencer -></button>
    </div>
  </div>
  <div>
  <p class="text-xl sm:text-2xl font-bold text-white mb-4">
    Tendances du moment
  </p>
  <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-6 p-6 items-center justify-center">
    <div class="bg-linear-to-br from-red-500 to-orange-500 h-50 rounded-xl cursor-pointer transition-transform duration-300 hover:scale-105"></div>
    <div class="bg-linear-to-br from-rose-400 to-red-500 h-50 rounded-xl cursor-pointer transition-transform duration-300 hover:scale-105"></div>
    <div class="bg-linear-to-br from-pink-500 to-rose-500 h-50 rounded-xl cursor-pointer transition-transform duration-300 hover:scale-105"></div>
    <div class="bg-linear-to-br from-amber-200 to-yellow-400 h-50 rounded-xl cursor-pointer transition-transform duration-300 hover:scale-105"></div>
    <div class="bg-linear-to-br from-amber-500 to-pink-500 h-50 rounded-xl cursor-pointer transition-transform duration-300 hover:scale-105"></div>
    <div class="bg-linear-to-br from-amber-500 to-pink-500 h-50 rounded-xl cursor-pointer transition-transform duration-300 hover:scale-105"></div>
  </div>
</div>

<div>
  <p class="text-xl sm:text-2xl font-bold text-white mb-4">
    Nouveautés
  </p>
  <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-6 p-6 items-center justify-center">
    <div class="bg-linear-to-br from-red-500 to-orange-500 h-50 rounded-xl cursor-pointer transition-transform duration-300 hover:scale-105"></div>
    <div class="bg-linear-to-br from-rose-400 to-red-500 h-50 rounded-xl cursor-pointer transition-transform duration-300 hover:scale-105"></div>
    <div class="bg-linear-to-br from-pink-500 to-rose-500 h-50 rounded-xl cursor-pointer transition-transform duration-300 hover:scale-105"></div>
    <div class="bg-linear-to-br from-amber-200 to-yellow-400 h-50 rounded-xl cursor-pointer transition-transform duration-300 hover:scale-105"></div>
    <div class="bg-linear-to-br from-amber-500 to-pink-500 h-50 rounded-xl cursor-pointer transition-transform duration-300 hover:scale-105"></div>
    <div class="bg-linear-to-br from-amber-500 to-pink-500 h-50 rounded-xl cursor-pointer transition-transform duration-300 hover:scale-105"></div>
  </div>
</div>
</body>

</html>
